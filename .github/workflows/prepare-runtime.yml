name: Prepare embedded runtime
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-runtime.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download original branding and pinned media runtime
        run: |
          mkdir -p runtime
          curl -fL --retry 3 https://raw.githubusercontent.com/JRDN-R/jaa/main/index.html -o runtime/reference.html
          curl -fL --retry 3 https://raw.githubusercontent.com/JRDN-R/jaa/main/assets/jordan-mark.png -o runtime/jordan-mark.png
          cd runtime
          npm pack mediabunny@1.57.0
          tar xzf mediabunny-1.57.0.tgz
          rm mediabunny-1.57.0.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: embedded-runtime
          path: runtime
          retention-days: 3
